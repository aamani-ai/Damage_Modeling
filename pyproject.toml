[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "damage-modeling"
version = "0.1.0"
description = "Damage-curve discipline: authoring lives in docs/cells; this package holds the RUNTIME-FACING machinery, starting with the durable GCS publisher (standard 23)."
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.17",
    "google-cloud-storage>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
damage-publish = "damage_modeling.publishing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
