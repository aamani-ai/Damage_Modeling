# The damage-curve dashboard on Cloud Run, behind IAP for aamani.ai accounts (plan DCD-D36). It deploys when the
# deploy/damage-curves branch moves; main stays non-deploying, so the team sees a new version only when the branch is
# moved to main (team runbook: gt_models docs/deployment/cloud-run-deploy-runbook.md). The page data must have been
# built from main (DCD-D30): a branch preview never ships.
name: Build and deploy damage-curves to Cloud Run

on:
  push:
    branches: [deploy/damage-curves]
    paths:
      - '.github/workflows/deploy-damage-curves.yml'
      - 'dashboard/app/**'
      - 'dashboard/components/**'
      - 'dashboard/lib/**'
      - 'dashboard/public/**'
      - 'dashboard/data/**'
      - 'dashboard/scripts/serve-static.mjs'
      - 'dashboard/package.json'
      - 'dashboard/package-lock.json'
      - 'dashboard/next.config.ts'
      - 'dashboard/tsconfig.json'
      - 'dashboard/postcss.config.mjs'
      - 'dashboard/Dockerfile'
      - 'dashboard/.dockerignore'
  workflow_dispatch: {}

concurrency:
  group: deploy-damage-curves
  cancel-in-progress: false

env:
  SERVICE: damage-curves
  REGION: us-central1
  GCP_PROJECT: modeling-nonprod-svc-db5x
  AR_HOST: us-central1-docker.pkg.dev
  AR_REPO: infrasuremodelingdocker
  APP_PATH: dashboard

jobs:
  build-and-deploy:
    if: github.repository == 'aamani-ai/Damage_Modeling'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ship only data built from main
        run: |
          python3 - <<'PY'
          import json, sys
          source = json.load(open("dashboard/data/manifest.json"))["source"]
          if source.get("mode") != "main":
              sys.exit(f"dashboard/data is {source.get('label')!r}: rebuild it from main before deploying (DCD-D30)")
          print("OK: the data was built from", source["label"])
          PY

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: modeling-nonprod-svc-db5x
          workload_identity_provider: projects/952205173464/locations/global/workloadIdentityPools/infrasure-gh-actions-pool/providers/github-repo-provider
          service_account: gh-actions-deploy@modeling-nonprod-svc-db5x.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: beta

      - name: Build and push the image
        run: |
          set -euo pipefail
          IMAGE="${AR_HOST}/${GCP_PROJECT}/${AR_REPO}/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "$AR_HOST" --quiet
          docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" --tag "$IMAGE" "$APP_PATH"
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy behind IAP
        # the integrated IAP flag is on the beta command surface (runbook gotcha 15)
        run: |
          gcloud beta run deploy "$SERVICE" \
            --project "$GCP_PROJECT" \
            --image "$IMAGE" \
            --platform managed \
            --region "$REGION" \
            --iap \
            --no-allow-unauthenticated \
            --service-account project-service-account@modeling-nonprod-svc-db5x.iam.gserviceaccount.com \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --port 8080

      - name: Let IAP reach the service, and aamani.ai accounts through IAP
        run: |
          gcloud run services add-iam-policy-binding "$SERVICE" \
            --project "$GCP_PROJECT" \
            --region "$REGION" \
            --member "serviceAccount:service-952205173464@gcp-sa-iap.iam.gserviceaccount.com" \
            --role roles/run.invoker
          gcloud iap web add-iam-policy-binding \
            --project "$GCP_PROJECT" \
            --resource-type=cloud-run \
            --service="$SERVICE" \
            --region="$REGION" \
            --member='domain:aamani.ai' \
            --role='roles/iap.httpsResourceAccessor' \
            --condition=None

      - name: Verify the deployed boundary
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT" --region "$REGION" --format='value(status.url)')"
          gcloud run services describe "$SERVICE" --project "$GCP_PROJECT" --region "$REGION" \
            --format='value(status.conditions[0].status)' | grep -qx True
          STATUS="$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "$URL/" || true)"
          case "$STATUS" in
            302|401|403) ;;
            *) echo "Expected IAP to refuse or redirect an anonymous request; got HTTP $STATUS"; exit 1 ;;
          esac
          echo "damage-curves is live at $URL: sign in with an aamani.ai Google account"
          echo "### damage-curves: $URL (sign in with an aamani.ai Google account)" >> "$GITHUB_STEP_SUMMARY"
