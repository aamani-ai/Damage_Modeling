# The derivation dashboard on Cloud Run. Public, no sign-in (owner, 13 Nov 2026: open it to anyone for now, so outside
# reviewers can read it). Earlier it was behind IAP for aamani.ai and infrasure.ai, like damage-curves (DCD-D36, D37). It deploys when the deploy/derivation-dashboard branch moves. The page data is generated here from
# the branch's own docs/cells, and the build stops if any derivation record disagrees with its curve file.
name: Build and deploy derivation-dashboard to Cloud Run

on:
  push:
    branches: [deploy/derivation-dashboard]
    paths:
      - '.github/workflows/deploy-derivation-dashboard.yml'
      - 'derivation_dashboard/**'
      - 'docs/cells/**'
  workflow_dispatch: {}

concurrency:
  group: deploy-derivation-dashboard
  cancel-in-progress: false

env:
  SERVICE: derivation-dashboard
  REGION: us-central1
  GCP_PROJECT: modeling-nonprod-svc-db5x
  AR_HOST: us-central1-docker.pkg.dev
  AR_REPO: infrasuremodelingdocker
  APP_PATH: derivation_dashboard

jobs:
  build-and-deploy:
    if: github.repository == 'aamani-ai/Damage_Modeling'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the page data from docs/cells, checking every derivation record
        run: python3 derivation_dashboard/tools/build.py

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: modeling-nonprod-svc-db5x
          workload_identity_provider: projects/952205173464/locations/global/workloadIdentityPools/infrasure-gh-actions-pool/providers/github-repo-provider
          service_account: gh-actions-deploy@modeling-nonprod-svc-db5x.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: beta

      - name: Build and push the image
        run: |
          set -euo pipefail
          IMAGE="${AR_HOST}/${GCP_PROJECT}/${AR_REPO}/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "$AR_HOST" --quiet
          docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" --tag "$IMAGE" "$APP_PATH"
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy, open to anyone with the link
        run: |
          gcloud beta run deploy "$SERVICE" \
            --project "$GCP_PROJECT" \
            --image "$IMAGE" \
            --platform managed \
            --region "$REGION" \
            --no-iap \
            --service-account project-service-account@modeling-nonprod-svc-db5x.iam.gserviceaccount.com \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --port 8080

      - name: Let anyone open it (allUsers; if an org policy refuses that, skip the invoker check instead)
        run: |
          if ! gcloud run services add-iam-policy-binding "$SERVICE" \
              --project "$GCP_PROJECT" --region "$REGION" \
              --member allUsers --role roles/run.invoker; then
            gcloud beta run services update "$SERVICE" \
              --project "$GCP_PROJECT" --region "$REGION" --no-invoker-iam-check
          fi

      - name: Verify the deployed boundary
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT" --region "$REGION" --format='value(status.url)')"
          gcloud run services describe "$SERVICE" --project "$GCP_PROJECT" --region "$REGION" \
            --format='value(status.conditions[0].status)' | grep -qx True
          STATUS="$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "$URL/" || true)"
          [ "$STATUS" = 200 ] || { echo "Expected the page to open without sign-in; got HTTP $STATUS"; exit 1; }
          echo "derivation-dashboard is live and public at $URL"
          echo "### derivation-dashboard: $URL (public, no sign-in)" >> "$GITHUB_STEP_SUMMARY"
