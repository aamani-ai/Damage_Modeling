# The derivation dashboard on Cloud Run, behind IAP for the Google accounts of IAP_DOMAINS, like damage-curves
# (DCD-D36, D37). It deploys when the deploy/derivation-dashboard branch moves. The page data is generated here from
# the branch's own docs/cells, and the build stops if any derivation record disagrees with its curve file.
name: Build and deploy derivation-dashboard to Cloud Run

on:
  push:
    branches: [deploy/derivation-dashboard]
    paths:
      - '.github/workflows/deploy-derivation-dashboard.yml'
      - 'derivation_dashboard/**'
      - 'docs/cells/**'
  workflow_dispatch: {}

concurrency:
  group: deploy-derivation-dashboard
  cancel-in-progress: false

env:
  SERVICE: derivation-dashboard
  REGION: us-central1
  GCP_PROJECT: modeling-nonprod-svc-db5x
  AR_HOST: us-central1-docker.pkg.dev
  AR_REPO: infrasuremodelingdocker
  APP_PATH: derivation_dashboard
  IAP_DOMAINS: aamani.ai infrasure.ai

jobs:
  build-and-deploy:
    if: github.repository == 'aamani-ai/Damage_Modeling'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the page data from docs/cells, checking every derivation record
        run: python3 derivation_dashboard/tools/build.py

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: modeling-nonprod-svc-db5x
          workload_identity_provider: projects/952205173464/locations/global/workloadIdentityPools/infrasure-gh-actions-pool/providers/github-repo-provider
          service_account: gh-actions-deploy@modeling-nonprod-svc-db5x.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: beta

      - name: Build and push the image
        run: |
          set -euo pipefail
          IMAGE="${AR_HOST}/${GCP_PROJECT}/${AR_REPO}/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "$AR_HOST" --quiet
          docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" --tag "$IMAGE" "$APP_PATH"
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy behind IAP
        run: |
          gcloud beta run deploy "$SERVICE" \
            --project "$GCP_PROJECT" \
            --image "$IMAGE" \
            --platform managed \
            --region "$REGION" \
            --iap \
            --no-allow-unauthenticated \
            --service-account project-service-account@modeling-nonprod-svc-db5x.iam.gserviceaccount.com \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --port 8080

      - name: Let IAP reach the service, and the accounts of IAP_DOMAINS through IAP
        run: |
          gcloud run services add-iam-policy-binding "$SERVICE" \
            --project "$GCP_PROJECT" \
            --region "$REGION" \
            --member "serviceAccount:service-952205173464@gcp-sa-iap.iam.gserviceaccount.com" \
            --role roles/run.invoker
          for domain in $IAP_DOMAINS; do
            gcloud iap web add-iam-policy-binding \
              --project "$GCP_PROJECT" \
              --resource-type=cloud-run \
              --service="$SERVICE" \
              --region="$REGION" \
              --member="domain:$domain" \
              --role='roles/iap.httpsResourceAccessor' \
              --condition=None
          done

      - name: Verify the deployed boundary
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT" --region "$REGION" --format='value(status.url)')"
          gcloud run services describe "$SERVICE" --project "$GCP_PROJECT" --region "$REGION" \
            --format='value(status.conditions[0].status)' | grep -qx True
          STATUS="$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "$URL/" || true)"
          case "$STATUS" in
            302|401|403) ;;
            *) echo "Expected IAP to refuse or redirect an anonymous request; got HTTP $STATUS"; exit 1 ;;
          esac
          echo "derivation-dashboard is live at $URL: sign in with a Google account of ${IAP_DOMAINS// / or }"
          echo "### derivation-dashboard: $URL (sign in with a Google account of ${IAP_DOMAINS// / or })" >> "$GITHUB_STEP_SUMMARY"
